name: Android Release

# 签名发布链：正式版本 tag 触发 → 固定密钥签名 Release APK → 资产断言 → 附加到 Release 草稿。
# 密钥材料只经 secrets 环境变量注入（安全红线：签名材料即密钥，不入库、不进日志）。
# 仅接受纯三段 tag（vX.Y.Z）：含 `-` 后缀的预发布/测试 tag 在 job if 层即不进入构建——
# tauri 派生忽略 pre 段，rc 与正式版同 versionCode，覆盖升级语义无法区分，试跑一律用正式 tag。
on:
  push:
    tags: ['v*']

env:
  RUST_TOOLCHAIN: "1.98.0"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/quota-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: 安装 Android SDK 与 NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: 校验 Rust 工具链锁定
        working-directory: ${{ github.workspace }}
        run: grep -Fqx "channel = \"${RUST_TOOLCHAIN}\"" rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/quota-desktop/pnpm-lock.yaml
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 生成 Android 工程
        run: pnpm android:init
      - name: 注入签名材料
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?缺少 secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?缺少 secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?缺少 secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?缺少 secret ANDROID_KEY_PASSWORD}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quotatray-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/quotatray-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > apps/quota-desktop/src-tauri/gen/android/keystore.properties
      - name: 构建 ARM64 签名 Release APK
        run: pnpm android:build -- --ci --apk --target aarch64
      - name: 资产签名与版本断言
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # 捕获组供 BASH_REMATCH 派生期望 versionCode，不能省略
          if ! [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::仅接受纯三段版本 tag（vX.Y.Z），收到：$GITHUB_REF_NAME"
            exit 1
          fi
          APK="apps/quota-desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          UNSIGNED="apps/quota-desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::产物缺失 $APK——签名配置未生效（应产出非 -unsigned 变体）"
            exit 1
          fi
          if [ -f "$UNSIGNED" ]; then
            echo "::error::存在 $UNSIGNED——release 构建未走签名路径"
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/36.0.0"
          # 包名与 ABI 断言：applicationId 由生成工程固定，ABI 由 aarch64 单目标构建保证
          "$BT/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          if ! grep -q "^package: name='com.quotatray.android'" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::包名不符"
            exit 1
          fi
          if ! grep -q "^native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::ABI 不含 arm64-v8a（--target 传错？）"
            exit 1
          fi
          # apksigner 侧：取签名证书 SHA-256（小写无冒号）
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certs.txt"
          apk_sha=$(grep -oP 'Signer #1 certificate SHA-256 digest: \K[0-9a-f]+' "$RUNNER_TEMP/apk-certs.txt" || true)
          # keytool 侧：按 alias 精确取条目；指纹行带 TAB+空格缩进，不能锚定裸行首
          keytool -list -v -keystore "$RUNNER_TEMP/quotatray-upload.jks" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks-certs.txt"
          ks_sha=$(grep -oP '^\s*SHA256: \K[0-9A-F:]+' "$RUNNER_TEMP/ks-certs.txt" | head -1 | tr -d ':' | tr 'A-F' 'a-f' || true)
          if [ -z "$apk_sha" ] || [ -z "$ks_sha" ] || [ "$apk_sha" != "$ks_sha" ]; then
            echo "::error::签名指纹与 keystore 不匹配（apk=$apk_sha keystore=$ks_sha）"
            exit 1
          fi
          # v2 方案检查：先捕获输出再 grep，避免 grep -q 提前退出在 pipefail 下误伤；
          # 输出格式为 "Verified using v2 scheme (APK Signature Scheme v2): true"，
          # 中缀括号注释各版本有道无道不一，以 [^:]* 容忍
          verify_out=$("$BT/apksigner" verify --verbose "$APK")
          if ! grep -Eq 'Verified using v2 scheme[^:]*: true' <<< "$verify_out"; then
            echo "::error::v2 签名方案缺失（minSdk 24 必须）"
            exit 1
          fi
          # versionCode 断言：实际值来自 workspace Cargo.toml（android-tauri.mjs 经 --config
          # 注入），此处校验其等于 tag 派生值——tag 与 Cargo.toml 版本不一致时在此拦截
          expected=$((BASH_REMATCH[1]*1000000 + BASH_REMATCH[2]*1000 + BASH_REMATCH[3]))
          actual=$(grep -oP 'tauri\.android\.versionCode=\K[0-9]+' apps/quota-desktop/src-tauri/gen/android/app/tauri.properties || true)
          if [ "$actual" != "$expected" ]; then
            echo "::error::versionCode 不符：实际 $actual，期望 $expected（源自 tag $TAG；请确认推 tag 前已 bump workspace 版本）"
            exit 1
          fi
          echo "APK 签名指纹 SHA-256：$apk_sha"
          echo "versionCode：$actual（$TAG）"
      - name: 上传 APK 至 Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="apps/quota-desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          TAG="${GITHUB_REF_NAME#v}"
          ASSET="QuotaTray_${TAG}_android-arm64.apk"
          cp "$APK" "$ASSET"
          # view 的非 404 失败（网络/限流）会被误判为不存在而走 create；若 release 实已
          # 存在，create 以 "already exists" 失败属安全方向（人工重跑即可），不静默覆盖
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "QuotaTray $TAG"
          gh release upload "$GITHUB_REF_NAME" "$ASSET" -R "$GITHUB_REPOSITORY" --clobber
      - name: 归档签名 APK
        uses: actions/upload-artifact@v4
        with:
          name: QuotaTray-android-arm64-release
          path: apps/quota-desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error
