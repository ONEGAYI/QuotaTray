name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows 优先（D4 决策）；Ubuntu 以最低成本守住"代码不锁死"承诺
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux 系统依赖
        # keyring 的 sync-secret-service 在 Linux 依赖 dbus 开发库（ubuntu runner 未预装）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: 格式检查
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 测试
        run: cargo test --workspace
      - name: Release 编译检查
        run: cargo check --release --workspace
        # dev-smoke 子命令仅 debug 构建存在（cfg(debug_assertions)），
        # release 编译通过 = 双面 cfg 无残留引用的自动验证
