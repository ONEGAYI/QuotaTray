name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows 优先（D4 决策）；Ubuntu 以最低成本守住"代码不锁死"承诺
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 系统依赖
        # Linux 原生 Secret Service Store 依赖 dbus；桌面端（Tauri）依赖 webkit 全家（M3 起）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 安装 WoA Rust 目标
        if: runner.os == 'Windows'
        run: rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 测试
        run: cargo test --workspace
      - name: Release 编译检查
        run: cargo check --release --workspace
        # dev-smoke 子命令仅 debug 构建存在（cfg(debug_assertions)），
        # release 编译通过 = 双面 cfg 无残留引用的自动验证
      - name: WoA 交叉编译检查
        if: runner.os == 'Windows'
        run: cargo check --workspace --all-targets --target aarch64-pc-windows-msvc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/quota-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/quota-desktop/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建与移动端契约测试
        run: |
          pnpm test:build-hook
          pnpm test:android-init
          pnpm test:android-tauri
          pnpm test:mobile-style
      - name: Lint
        run: pnpm lint
      - name: 构建（tsc + vite）
        run: pnpm build

  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/quota-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: 安装 Android SDK 与 NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/quota-desktop/pnpm-lock.yaml
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 生成 Android 工程
        run: pnpm android:init
      - name: 构建 ARM64 Preview 调试 APK
        run: pnpm android:build -- --ci --debug --apk --target aarch64
      - name: 上传可安装 Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: QuotaTray-android-arm64-preview-debug
          path: apps/quota-desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
