[workspace]
resolver = "3"
members = ["crates/quota-core", "apps/quota-cli", "apps/quota-desktop/src-tauri"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "string"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "signal"] }
aes-gcm = "0.10"
keyring-core = "1.0.0"
base64 = "0.22"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
zeroize = "1"
dialoguer = "0.11"
console = "0.15"
arboard = "3"
comfy-table = "7"
getrandom = "0.3"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
# QuickJS 沙箱（M4 script provider）：默认内嵌编译 QuickJS-NG 源码（MSRV 1.87）
rquickjs = "0.12"
# 历史数据存储（M5 history）：bundled 内嵌编译 SQLite，Windows 分发自包含
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = true
