[workspace]
resolver = "3"
members = ["crates/quota-core", "apps/quota-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "string"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "signal"] }
aes-gcm = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
base64 = "0.22"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
zeroize = "1"
dialoguer = "0.11"
console = "0.15"
arboard = "3"
comfy-table = "7"
getrandom = "0.3"
futures = "0.3"

[profile.release]
lto = "thin"
strip = true
