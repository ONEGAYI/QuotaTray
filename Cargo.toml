[workspace]
resolver = "3"
members = ["crates/quota-core", "apps/quota-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "string"] }

[profile.release]
lto = "thin"
strip = true
