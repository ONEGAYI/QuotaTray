[package]
name = "quota-desktop"
description = "QuotaTray 桌面端：托盘常驻余额监视器（Tauri 2）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "quota_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quota-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quota-core = { path = "../../../crates/quota-core" }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2" # 标题栏 GitHub 按钮：外部浏览器打开仓库主页
tauri-plugin-notification = "2" # 更新就绪系统通知（主窗不可见时；Rust 侧发送）
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
# 桌面端私有依赖（不动 workspace 根共享段）：
sys-locale = "0.3"   # language=system 时解析系统 locale
async-trait = "0.1"  # update_ctl 测试注入 mock HttpClient/AssetDownloader

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tiny-skia = "0.11" # 托盘圆环图标抗锯齿绘制

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2.5.1"

[target.'cfg(target_os = "android")'.dependencies]
# APK 安装引导 JNI 桥（src/apk_install.rs）：版本与 keyring 生态一致（锁文件已有）
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging", # 悬停面板 show 后重插 topmost 组顶（压过隐藏托盘 flyout）
  "Win32_Foundation",
] }
