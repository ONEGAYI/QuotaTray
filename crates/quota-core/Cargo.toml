[package]
name = "quota-core"
description = "QuotaTray 业务核心：数据模型、查询引擎、凭据保险库"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
aes-gcm = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
getrandom = { workspace = true }
keyring-core = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
rquickjs = { workspace = true }
rusqlite = { workspace = true }
log = { workspace = true, features = ["std"] }
# 装配端（desktop/CLI）经 `flexi-logging` feature 开启滚动日志实现；
# core 默认构建不带此依赖，保持库纯净
flexi_logger = { workspace = true, optional = true }

[features]
flexi-logging = ["dep:flexi_logger"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
# rquickjs-sys 不随 crate 发布 Android 预生成绑定，Android 目标需在构建时生成。
rquickjs = { workspace = true, features = ["bindgen"] }

[dev-dependencies]
# 重试契约测试用 #[tokio::test(start_paused)] 即时推进重试间隔；
# dev-dependencies 的 feature 仅测试目标激活，不影响发布构建
tokio = { workspace = true, features = ["test-util"] }
